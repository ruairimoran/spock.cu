[project]
name = "spockAPI"
dynamic = ["version"]
license = {text = "Apache 2.0"}
readme = "README.md"
authors = [
    {name = "Ruairi Moran", email = "rmoran05@qub.ac.uk"},
    {name = "Pantelis Sopasakis", email = "p.sopasakis@qub.ac.uk"},
]
description = "API for SPOCK: a solver for multistage risk-averse optimal control problems"
keywords=['risk averse, optimal control, parallel']
requires-python = ">=3.8"
classifiers = [
    "Programming Languages :: Python",
    "Operating System :: OS Independent",
]
dependencies = [
    'numpy<2',
    'scipy',
    'matplotlib',
    'jinja2',
    'gputils_api @ https://github.com/GPUEngineering/GPUtils/archive/refs/tags/v2.0.0.zip#subdirectory=python&sha256=4ba677216d0da6023af03f465dacb7cba68574a4fab31a3172a9236f0bf18b86'
]

[project.optional-dependencies]
draw = [
    'PythonTurtle',
]
example = [
    'argparse',
    'pandas',
    'mosek',
]
test = [
    'cvxpy',
]
all = [
    'PythonTurtle',
    'argparse',
    'pandas',
    'mosek',
    'cvxpy',
]

[project.urls]
Repository = "https://github.com/ruairimoran/raocp-parallel"
Issues = "https://github.com/ruairimoran/raocp-parallel/issues"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages]
find = {}

[tool.setuptools.dynamic]
version = {attr = "spock.meta.__version__"}
